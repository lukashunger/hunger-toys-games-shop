name: Update Ricardo Inventory

# HINWEIS: ricardo.ch blockiert Anfragen von GitHub-Actions-Servern (403
# Forbidden) - auch mit Browser-Fingerprint-Spoofing (curl_cffi). Der
# taegliche Cron-Trigger ist deshalb deaktiviert, um taegliche Fehler-Mails
# zu vermeiden. items.json wird stattdessen manuell (oder ueber Claude/
# Cowork) aktualisiert. Falls ricardo.ch die Sperre irgendwann aufhebt,
# einfach den auskommentierten "schedule"-Block unten wieder aktivieren.

on:
  # schedule:
  #   - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add items.json
          git diff --staged --quiet || git commit -m "Auto-update inventory $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
